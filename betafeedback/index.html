<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Feedback forms for JiKay beta devices."
    />
    <meta name="theme-color" content="#080611" />

    <title>Beta Feedback — JiKay</title>
    <link rel="canonical" href="https://jikay.co.uk/betafeedback/" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      THESIS: Feedback starts with one unmistakable choice, not a portal full of friction.
      OWN-WORLD: JiKay's violet-black studio image, white mark, lavender signals, fine rules, and direct Helvetica typography.
      STORY: Recognise the beta space, choose the device being tested, and move directly to its feedback form.
      FIRST VIEWPORT: Compact brand header above a vertically centred title and full-width device action within the studio scene.
      FORM: Focused device directory; the list scales by adding rows without changing the page hierarchy.
    -->
    <a class="skip-link" href="#feedback-forms">Skip to feedback forms</a>

    <header class="site-header">
      <a class="brand" href="../" aria-label="JiKay home">
        <img
          src="../assets/images/jikay_logo_2021_White.png"
          alt=""
          width="2156"
          height="1719"
        />
      </a>
      <span class="section-label" aria-current="page">Beta feedback</span>
    </header>

    <main class="feedback" id="feedback-forms">
      <div class="feedback__intro">
        <p class="feedback__kicker">Max for Live</p>
        <h1>Share your feedback.</h1>
        <p class="feedback__lede">
          Choose the device you’ve been testing to open its feedback form.
        </p>
      </div>

      <nav class="device-list" aria-label="Device feedback forms">
        <a
          class="device-link"
          href="https://docs.google.com/forms/d/1jW1joPW_Z3EQ4lwSpdasOfw1C4QlA7WYRkrDCQ4yrvI/viewform"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="device-link__name">Studio Remote</span>
          <span class="device-link__action">
            Open feedback form
            <span class="device-link__arrow" aria-hidden="true">↗</span>
          </span>
        </a>
      </nav>
    </main>
  </body>
</html>
